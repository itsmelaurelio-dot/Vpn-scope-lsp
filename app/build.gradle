plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hanaka.vpnperapp'
    compileSdk 34

    defaultConfig {
        applicationId 'com.hanaka.vpnperapp'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    // WAJIB compileOnly, jangan implementation (jangan ikut masuk ke APK)
    compileOnly 'de.robv.android.xposed:api:82'
}
